[project]
name = "chinese-app-api"
version = "0.1.0"
description = "FastAPI backend for the Chinese learning app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=2.17.0",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.52.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
